<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer | 25:00</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="mode-pomodoro">
  <!-- Background Glow Element -->
  <div class="glow-backdrop" aria-hidden="true"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="logo-text">FocusFlow</span>
      </div>
      <div class="header-actions">
        <button id="btnSettings" class="icon-button" title="Timer Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Mode Selector Tabs -->
    <nav class="mode-tabs" role="tablist" aria-label="Timer Modes">
      <button class="mode-tab active" data-mode="pomodoro" role="tab" aria-selected="true" id="tab-pomodoro">
        Pomodoro
      </button>
      <button class="mode-tab" data-mode="shortBreak" role="tab" aria-selected="false" id="tab-shortBreak">
        Short Break
      </button>
      <button class="mode-tab" data-mode="longBreak" role="tab" aria-selected="false" id="tab-longBreak">
        Long Break
      </button>
    </nav>

    <!-- Central Timer Display with Circular Progress -->
    <section class="timer-section" aria-label="Timer Display">
      <div class="circular-progress-wrapper">
        <svg class="progress-ring" width="320" height="320" viewBox="0 0 320 320">
          <defs>
            <linearGradient id="pomodoroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f43f5e" />
              <stop offset="100%" stop-color="#fb7185" />
            </linearGradient>
            <linearGradient id="shortBreakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#34d399" />
            </linearGradient>
            <linearGradient id="longBreakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#06b6d4" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
            <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          
          <!-- Background Track -->
          <circle class="ring-bg" cx="160" cy="160" r="140" stroke-width="12"></circle>
          
          <!-- Glowing Animated Progress Arc -->
          <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="140" stroke-width="12" stroke-linecap="round"></circle>
        </svg>

        <!-- Inner Content Overlay -->
        <div class="timer-display-content">
          <span class="mode-badge" id="modeBadge">Focus Time</span>
          <div class="time-display" id="timeDisplay" aria-live="polite">25:00</div>
          <span class="timer-subtext" id="timerStatus">Ready to focus</span>
        </div>
      </div>
    </section>

    <!-- Primary Timer Controls -->
    <section class="controls-section" aria-label="Timer Controls">
      <div class="button-group">
        <button id="btnReset" class="btn btn-secondary" title="Reset current timer (Key: R)" aria-label="Reset Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Reset</span>
        </button>

        <button id="btnStartPause" class="btn btn-primary" title="Start/Pause timer (Key: Space)" aria-label="Start Timer">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
          <span id="startPauseText">Start</span>
        </button>

        <button id="btnSkip" class="btn btn-secondary" title="Skip to next session" aria-label="Skip to Next Session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
          <span>Skip</span>
        </button>
      </div>
    </section>

    <!-- Sound & Audio Notification Quick Bar -->
    <section class="sound-bar" aria-label="Sound Controls">
      <div class="sound-control-item">
        <button id="btnMuteToggle" class="icon-button mini" title="Toggle Mute (Key: M)" aria-label="Toggle mute">
          <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="icon-sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <div class="volume-slider-wrapper">
          <input type="range" id="volumeSlider" min="0" max="100" value="80" title="Audio volume" aria-label="Notification volume">
          <span id="volumeValue" class="volume-label">80%</span>
        </div>
      </div>

      <div class="sound-control-item">
        <select id="soundPresetSelect" class="sound-select" title="Notification sound style">
          <option value="zenChime" selected>Zen Chime (Tibetan Bell)</option>
          <option value="digitalBell">Digital Arpeggio</option>
          <option value="marimba">Warm Marimba</option>
          <option value="classicBeep">Classic Beeps</option>
        </select>

        <button id="btnTestSound" class="btn btn-outline-sm" title="Preview chime sound" aria-label="Test chime sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span>Test</span>
        </button>
      </div>
    </section>

    <!-- Session Progress Dots & Stats -->
    <footer class="app-footer">
      <div class="session-progress">
        <div class="cycle-label">
          <span>Cycle <strong id="currentCycleNumber">1</strong></span>
          <span class="cycle-count-text" id="cycleSummary">0 of 4 Completed</span>
        </div>
        <div class="session-dots" id="sessionDots" aria-label="Completed Pomodoro Sessions in current cycle">
          <div class="dot" data-index="1" title="Pomodoro 1"></div>
          <div class="dot" data-index="2" title="Pomodoro 2"></div>
          <div class="dot" data-index="3" title="Pomodoro 3"></div>
          <div class="dot" data-index="4" title="Pomodoro 4"></div>
        </div>
      </div>

      <div class="keyboard-hints">
        <span><kbd>Space</kbd> Start/Pause</span>
        <span><kbd>R</kbd> Reset</span>
        <span><kbd>M</kbd> Mute</span>
      </div>
    </footer>
  </main>

  <!-- Settings Modal Dialog -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Settings</h2>
        <button id="btnCloseSettings" class="icon-button mini" aria-label="Close settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <h3 class="setting-group-title">Time (Minutes)</h3>
        <div class="setting-inputs-grid">
          <div class="setting-field">
            <label for="inputPomodoro">Pomodoro</label>
            <input type="number" id="inputPomodoro" min="1" max="90" value="25">
          </div>
          <div class="setting-field">
            <label for="inputShortBreak">Short Break</label>
            <input type="number" id="inputShortBreak" min="1" max="30" value="5">
          </div>
          <div class="setting-field">
            <label for="inputLongBreak">Long Break</label>
            <input type="number" id="inputLongBreak" min="1" max="60" value="15">
          </div>
        </div>

        <h3 class="setting-group-title mt-4">Automation</h3>
        <div class="setting-toggle-row">
          <label for="toggleAutoBreak" class="toggle-label">Auto-start Breaks</label>
          <input type="checkbox" id="toggleAutoBreak" class="toggle-checkbox">
        </div>
        <div class="setting-toggle-row">
          <label for="toggleAutoPomodoro" class="toggle-label">Auto-start Pomodoros</label>
          <input type="checkbox" id="toggleAutoPomodoro" class="toggle-checkbox">
        </div>
        <div class="setting-toggle-row">
          <label for="toggleNotifications" class="toggle-label">Browser Notifications</label>
          <input type="checkbox" id="toggleNotifications" class="toggle-checkbox">
        </div>

        <!-- Quick Reset to Defaults -->
        <div class="modal-footer-actions">
          <button id="btnRestoreDefaults" class="btn btn-text">Reset to Defaults</button>
          <button id="btnSaveSettings" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
